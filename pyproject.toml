[project]
name = "recipe-search-api"
version = "0.1.0"
description = "Sparse, dense and hybrid (reranked) retrieval over recipe chunks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
